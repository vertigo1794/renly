<body class="bg-background text-on-background antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full sticky top-0 z-50">
<button class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full flex items-center justify-center scale-95 active:duration-100">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tighter">Renly</h1>
<button class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full flex items-center justify-center scale-95 active:duration-100">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-md flex flex-col md:max-w-2xl md:mx-auto w-full pb-32">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-xs text-on-background">Post a Listing</h2>
<p class="font-body-md text-body-md text-secondary">What are you looking to do today?</p>
</div>
<!-- Form Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-md flex flex-col gap-md relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-fixed to-primary-container"></div>
<!-- Toggle: Sediakan Listing vs Cari Listing -->
<div class="flex bg-surface-container rounded-lg p-1 relative">
<!-- Active Indicator (Animated via JS logic below) -->
<div class="absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-primary-container rounded-md shadow-sm transition-transform duration-300 ease-in-out" id="toggle-indicator"></div>
<button class="relative z-10 flex-1 py-2 text-center font-button-text text-button-text text-on-primary-container transition-colors duration-300" id="tab-sediakan" onclick="switchTab('sediakan')">
                    Sediakan Listing
                </button>
<button class="relative z-10 flex-1 py-2 text-center font-button-text text-button-text text-secondary transition-colors duration-300" id="tab-cari" onclick="switchTab('cari')">
                    Cari Listing
                </button>
</div>
<form class="flex flex-col gap-md mt-sm">
<!-- Property Type Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="property-type">Property Type</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-3 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-on-surface focus:ring-0 transition-colors" id="property-type">
<option value="apartment">Apartment</option>
<option value="house">House</option>
<option value="commercial">Commercial Space</option>
<option value="land">Land</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-secondary pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Price Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="price">Price (IDR)</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 font-title-md text-title-md text-secondary select-none">Rp</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-[48px] pr-sm py-3 font-title-md text-title-md text-on-surface focus:outline-none focus:border-on-surface focus:ring-0 transition-colors placeholder:text-outline-variant" id="price" placeholder="0" type="number"/>
</div>
</div>
<!-- Location Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="location">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary pointer-events-none">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-sm py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-on-surface focus:ring-0 transition-colors placeholder:text-outline-variant" id="location" placeholder="City, Neighborhood, or Zip" type="text"/>
</div>
</div>
<!-- Photos Section (Only for Sediakan) -->
<div class="flex flex-col gap-xs transition-opacity duration-300" id="photos-section">
<label class="font-label-caps text-label-caps text-secondary uppercase flex justify-between items-center">
<span>Photos</span>
<span class="text-outline">Max 10</span>
</label>
<div class="grid grid-cols-3 gap-2">
<!-- Upload Button -->
<button class="aspect-square bg-surface-container hover:bg-surface-variant transition-colors border border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center text-secondary gap-1" type="button">
<span class="material-symbols-outlined filled text-[28px]">add_a_photo</span>
<span class="font-label-caps text-[10px]">Add Photo</span>
</button>
<!-- Placeholder Image 1 -->
<div class="aspect-square rounded-lg overflow-hidden relative group">
<img class="w-full h-full object-cover" data-alt="A modern, brightly lit interior of an apartment living room during daytime. The room features minimalist furniture with sharp geometric lines and a neutral color palette of off-whites and deep charcoals. Large windows let in abundant natural light, highlighting a vibrant lime green accent pillow on the sofa. The overall aesthetic is clean, professional, and high-contrast." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBb-NtWScGdINR9Fy80wmHIzU-vghsFHNSEoTzyqs7rBULjY-Xmty8b1DnUKFELEDj_3CfEMzb3qCEnn9oCRBYGHGTC6LTGOENI3Yrqqxr9J2RKSKbuYUPk5AjJa3iWzZuKdZVcJ8X0CBmG1vuoNtZVAezWwKZcYPSfp7s3rSJR0uKS2WDVRFhpUt5eWFd-KpWzdQaa5NGPsHxErgmSR4T8le2DAJKw-1wnZ-6Ji9B0yjHePzy766vaig"/>
<button class="absolute top-1 right-1 bg-inverse-surface/80 text-inverse-on-surface rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-fixed hover:bg-primary-fixed-dim text-on-primary-fixed font-button-text text-button-text py-4 rounded-xl mt-sm transition-colors shadow-[0_4px_12px_rgba(0,0,0,0.05)] active:scale-[0.98]" type="button">
                    Post Now
                </button>
</form>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant shadow-lg rounded-t-xl md:hidden pb-safe">
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-all p-2" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-all p-2" href="#">
<span class="material-symbols-outlined">storefront</span>
<span class="font-label-caps text-label-caps mt-1">Market</span>
</a>
<!-- Active Nav Item -->
<a class="flex flex-col items-center justify-center text-primary font-bold bg-primary-container/10 rounded-xl p-2 scale-110 duration-200 ease-out" href="#">
<span class="material-symbols-outlined filled">add_circle</span>
<span class="font-label-caps text-label-caps mt-1">Post</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-all p-2" href="#">
<span class="material-symbols-outlined">chat_bubble</span>
<span class="font-label-caps text-label-caps mt-1">Chat</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-fixed-dim transition-all p-2" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</a>
</nav>
<script>
        function switchTab(tab) {
            const indicator = document.getElementById('toggle-indicator');
            const tabSediakan = document.getElementById('tab-sediakan');
            const tabCari = document.getElementById('tab-cari');
            const photosSection = document.getElementById('photos-section');

            if (tab === 'sediakan') {
                indicator.style.transform = 'translateX(0)';
                tabSediakan.classList.add('text-on-primary-container');
                tabSediakan.classList.remove('text-secondary');
                tabCari.classList.add('text-secondary');
                tabCari.classList.remove('text-on-primary-container');
                
                photosSection.style.display = 'flex';
                // Slight delay for animation to register
                setTimeout(() => {
                    photosSection.style.opacity = '1';
                }, 10);
                
            } else {
                indicator.style.transform = 'translateX(100%)';
                // Add margin to account for indicator translation
                indicator.style.marginLeft = '4px';
                
                tabCari.classList.add('text-on-primary-container');
                tabCari.classList.remove('text-secondary');
                tabSediakan.classList.add('text-secondary');
                tabSediakan.classList.remove('text-on-primary-container');
                
                photosSection.style.opacity = '0';
                setTimeout(() => {
                    photosSection.style.display = 'none';
                }, 300);
            }
        }
        
        // Reset margin when going back to sediakan
        document.getElementById('tab-sediakan').addEventListener('click', function() {
            document.getElementById('toggle-indicator').style.marginLeft = '0px';
        });
    </script>
</body></html>
