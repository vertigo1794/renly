<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registration - Personal Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#8140f2",
                        "inverse-surface": "#2e312f",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#f4eaff",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-container": "#656464",

                        "secondary-container": "#e5e2e1",

                        "primary-fixed-dim": "#b0d500",
                        "on-primary-container": "#5f7400",
                        "surface-variant": "#e2e3e0",
                        "on-surface": "#191c1b",
                        "tertiary": "#732ee4",
                        "surface-container-highest": "#e2e3e0",
                        "on-primary-fixed-variant": "#3e4c00",
                        "on-secondary-fixed-variant": "#474646",
                        "inverse-primary": "#b0d500",
                        "on-tertiary-fixed": "#25005a",
                        "inverse-on-surface": "#f0f1ee",
                        "on-primary-fixed": "#171e00",
                        "secondary": "#5f5e5e",
                        "primary": "#536600",
                        "surface-container": "#edeeeb",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1b",
                        "surface-container-high": "#e7e8e6",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#e5e2e1",
                        "error-container": "#ffdad6",
                        "primary-container": "#d4ff00",
                        "outline-variant": "#c5c9ac",
                        "background": "#f9faf7",
                        "surface-bright": "#f9faf7",
                        "tertiary-fixed": "#eaddff",
                        "tertiary-fixed-dim": "#d2bbff",
                        "surface-dim": "#d9dad7",
                        "on-surface-variant": "#444932",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f3f4f1",
                        "on-secondary-fixed": "#1c1b1b",
                        "outline": "#757a60",
                        "surface": "#f9faf7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "lg": "40px",
                        "sm": "12px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "margin-desktop": "120px",
                        "base": "8px",
                        "xl": "64px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "button-text": ["Hanken Grotesk"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Top App Bar (Transactional intent - simplified back button header) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full bg-background border-b border-outline-variant flat no shadows top-0 sticky z-10">
<button aria-label="Go back" class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full flex items-center justify-center scale-95 active:duration-100">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tighter">Renly</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow px-margin-mobile py-lg max-w-[600px] mx-auto w-full md:px-margin-desktop md:max-w-4xl flex flex-col justify-center">
<div class="mb-lg text-center md:text-left">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-base">Create Account</h2>
<p class="font-body-md text-body-md text-secondary">Join Renly to collaborate and manage your properties seamlessly.</p>
</div>
<!-- Progress Indicator (Step 1 of 2) -->
<div class="mb-lg">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-caps text-label-caps text-primary uppercase">Personal Details</span>
<span class="font-label-caps text-label-caps text-secondary uppercase">Step 1 of 2</span>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed w-1/2 rounded-full transition-all duration-300"></div>
</div>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Nama Penuh Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="fullName">Nama Penuh</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-secondary">
<span class="material-symbols-outlined">person</span>
</span>
<input class="w-full bg-surface-container-lowest border border-[#E0E0E0] text-on-surface font-body-md text-body-md rounded-lg pl-[40px] pr-sm py-sm focus:border-on-surface focus:ring-0 focus:outline-none transition-colors" id="fullName" name="fullName" placeholder="Enter your full name as per IC" required="" type="text"/>
</div>
</div>
<!-- Nombor Kad Pengenalan (IC) Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="icNumber">Nombor Kad Pengenalan (IC)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-secondary">
<span class="material-symbols-outlined">badge</span>
</span>
<input class="w-full bg-surface-container-lowest border border-[#E0E0E0] text-on-surface font-body-md text-body-md rounded-lg pl-[40px] pr-sm py-sm focus:border-on-surface focus:ring-0 focus:outline-none transition-colors" id="icNumber" name="icNumber" placeholder="e.g., 900101-14-5555" required="" type="text"/>
</div>
</div>
<!-- Nombor Telefon Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="phoneNumber">Nombor Telefon</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-secondary">
<span class="material-symbols-outlined">phone_iphone</span>
</span>
<input class="w-full bg-surface-container-lowest border border-[#E0E0E0] text-on-surface font-body-md text-body-md rounded-lg pl-[40px] pr-sm py-sm focus:border-on-surface focus:ring-0 focus:outline-none transition-colors" id="phoneNumber" name="phoneNumber" placeholder="e.g., 012-3456789" required="" type="tel"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-md mt-lg flex flex-col md:flex-row gap-sm justify-end border-t border-surface-variant">
<button class="px-lg py-sm rounded-lg bg-surface-container-highest text-on-surface font-button-text text-button-text hover:bg-surface-variant transition-colors md:w-auto w-full text-center" type="button">Cancel</button>
<button class="px-lg py-sm rounded-lg bg-primary-fixed text-on-primary-fixed font-button-text text-button-text hover:bg-primary-fixed-dim transition-colors md:w-auto w-full text-center flex items-center justify-center gap-xs" type="submit">
                    Next Step <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</main>
</body></html>
