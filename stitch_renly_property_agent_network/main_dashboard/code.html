<style>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-40 bg-background border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center space-x-4">
<button class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="flex items-center">
<img alt="Renly Logo" class="h-8 w-8 mr-2 object-contain rounded-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8rhnFoowK1nUay3tnq1KVmaQqkBXx-v-sHLUgrBxy00nO9b931vnZfyr5huOVrNwMa3ZvHAFEQ3wBdhokd0yWe-Y-SSICUN9yyifAxdVUy5RehLIxUlgLVgDujuP-dIFtz0YsxKGkGk0JOgtDq4ex2yETcVp9H1RW_GVOloNFQr8cRju_uzOHgZ5WRClpF0L0D2QxmEYksCWSTbU8YRH5B1k1NfmQd3HSfF9bsIs5NC2lfwu-JKc0gQ"/>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background tracking-tighter">Renly</span>
</div>
</div>
<button class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 duration-100 relative">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full"></span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] px-margin-mobile pb-6 md:max-w-[1440px] md:mx-auto w-full">
<!-- Welcome Area -->
<section class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-xs">Welcome back, Agent.</h1>
<p class="font-body-md text-body-md text-secondary">Market is moving. Here's your daily briefing.</p>
</section>
<!-- Quick Actions Bento Grid -->
<section class="mb-lg">
<h2 class="font-title-md text-title-md mb-md">Quick Actions</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- Action 1 -->
<button class="bg-surface-container-highest p-sm rounded-xl flex flex-col items-start justify-between h-24 hover:bg-primary-container hover:text-on-primary-container transition-colors group active:scale-95 border border-outline-variant/30 relative overflow-hidden">
<span class="material-symbols-outlined text-on-surface group-hover:text-on-primary-container mb-2" data-icon="add_circle">add_circle</span>
<span class="font-button-text text-button-text text-left">Post Listing</span>
<!-- Decorative subtle accent -->
<div class="absolute -bottom-4 -right-4 w-12 h-12 bg-primary/10 rounded-full group-hover:scale-150 transition-transform"></div>
</button>
<!-- Action 2 -->
<button class="bg-surface-container-highest p-sm rounded-xl flex flex-col items-start justify-between h-24 hover:bg-primary-container hover:text-on-primary-container transition-colors group active:scale-95 border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface group-hover:text-on-primary-container mb-2" data-icon="storefront">storefront</span>
<span class="font-button-text text-button-text text-left">Market</span>
</button>
<!-- Action 3 -->
<button class="bg-surface-container-highest p-sm rounded-xl flex flex-col items-start justify-between h-24 hover:bg-primary-container hover:text-on-primary-container transition-colors group active:scale-95 border border-outline-variant/30 col-span-2 md:col-span-1">
<span class="material-symbols-outlined text-on-surface group-hover:text-on-primary-container mb-2" data-icon="list_alt">list_alt</span>
<span class="font-button-text text-button-text text-left">My Inventory</span>
</button>
</div>
</section>
<!-- Matches for You - High Contrast Carousel -->

<h2 class="font-title-md text-title-md">Matches for You</h2>
<button class="text-primary font-button-text text-button-text hover:underline">View All</button>
</div>
<div class="flex overflow-x-auto gap-gutter hide-scrollbar pb-4 snap-x">
<!-- Property Card 1 -->
<div class="min-w-[280px] w-[80vw] md:w-[320px] bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] snap-center overflow-hidden flex flex-col">

<div class="absolute top-sm left-sm bg-surface-container-lowest px-2 py-1 rounded-full flex items-center shadow-sm">
<span class="w-2 h-2 bg-primary rounded-full mr-1"></span>
<span class="font-label-caps text-label-caps text-on-surface">Available</span>
</div>
</div>
<div class="p-sm flex-grow flex flex-col justify-between">
<div>
<p class="font-title-md text-title-md text-on-surface">$2,450,000</p>
<p class="font-label-caps text-label-caps text-secondary mt-1 uppercase">124 Maple St, Downtown</p>
</div>
<div class="flex items-center gap-4 mt-sm border-t border-surface-variant pt-sm">
<div class="flex items-center text-secondary">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="bed">bed</span>
<span class="font-body-md text-sm">4</span>
</div>
<div class="flex items-center text-secondary">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="bathtub">bathtub</span>
<span class="font-body-md text-sm">3</span>
</div>
<div class="flex items-center text-secondary">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="square_foot">square_foot</span>

</div>
</div>
</div>
<!-- Property Card 2 -->

<img class="w-full h-full object-cover" data-alt="An interior shot of a highly modern, minimalist living room in a luxury penthouse. The space features stark white walls, deep charcoal structural elements, and a vibrant lime green accent chair acting as a focal point. Large windows let in bright, natural daylight, casting sharp, clean shadows. The aesthetic is extremely professional, engineered, and high-contrast, perfectly suited for an elite real estate platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAG7ylvIEy2K94kIB8e8FbeolzLD1fX7J-aRttmaKqRgdZtgMpICDtBVlxdEkiCDfaJYBFn_slD5YSWAifsuW7hYnCuSI-BcZCM5-Bz8-jJM9vMTd0w_N8Z4ENC91dcIbPowtrW4NeoPazWsdEqQZrIjseo2zoi5xYOzQa0TQI7vaohAIdu3c2RMLmDDo3ZIDiGJlvWBCjdGrwU_GmrxkDymrUs2J14p6AZmb48cjeP6Ye5jUsRuyduOw"/>
<div class="absolute top-sm left-sm bg-surface-container-lowest px-2 py-1 rounded-full flex items-center shadow-sm">
<span class="w-2 h-2 bg-primary rounded-full mr-1"></span>
<span class="font-label-caps text-label-caps text-on-surface">Available</span>
</div>
</div>
<div class="p-sm flex-grow flex flex-col justify-between">
<div>
<p class="font-title-md text-title-md text-on-surface">$1,850,000</p>

<div class="flex items-center gap-4 mt-sm border-t border-surface-variant pt-sm">
<div class="flex items-center text-secondary">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="bed">bed</span>
<span class="font-body-md text-sm">2</span>
</div>
<div class="flex items-center text-secondary">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="bathtub">bathtub</span>
<span class="font-body-md text-sm">2</span>
</div>
<div class="flex items-center text-secondary">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="square_foot">square_foot</span>
<span class="font-body-md text-sm">1,800</span>
</div>

</div>
</div>
</div>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant shadow-lg rounded-t-xl pb-6">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-primary font-bold bg-primary-container/10 rounded-xl p-2 scale-110 duration-200 ease-out transition-all group">
<span class="material-symbols-outlined fill" data-icon="home" data-weight="fill">home</span>
<span class="font-label-caps text-[10px] mt-1">Home</span>
</button>
<!-- Market -->
<button class="flex flex-col items-center justify-center text-secondary p-2 hover:text-primary-fixed-dim transition-all group">
<span class="material-symbols-outlined group-hover:fill" data-icon="storefront">storefront</span>
<span class="font-label-caps text-[10px] mt-1">Market</span>
</button>
<!-- Post (FAB Style integration) -->
<button class="flex flex-col items-center justify-center -mt-6 bg-primary text-on-primary rounded-full p-3 shadow-[0_4px_12px_rgba(83,102,0,0.4)] hover:bg-primary-fixed hover:text-on-primary-fixed transition-all active:scale-95 group border-2 border-surface">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<!-- Hidden label to match structure, visually hidden for FAB look -->
<span class="sr-only">Post</span>
</button>
<!-- Chat -->
<button class="flex flex-col items-center justify-center text-secondary p-2 hover:text-primary-fixed-dim transition-all group relative">
<span class="material-symbols-outlined group-hover:fill" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-caps text-[10px] mt-1">Chat</span>
<!-- Badge -->
<span class="absolute top-1 right-2 w-2 h-2 bg-error rounded-full border border-surface"></span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-secondary p-2 hover:text-primary-fixed-dim transition-all group">
<span class="material-symbols-outlined group-hover:fill" data-icon="person">person</span>
<span class="font-label-caps text-[10px] mt-1">Profile</span>
</button>
</nav>
