name: renly
description: "renly — verified co-broking platform for Malaysian real estate negotiators."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.0
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  flutter_stripe: ^14.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  phosphor_flutter: ^2.1.0
  # Regular dependency, not dev-only: FlutterNativeSplash.preserve()/remove()
  # are called from main.dart/splash_screen.dart at runtime, not just from
  # the `dart run flutter_native_splash:create` generator.
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/illustrations/
    - .env

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Consumed by `dart run flutter_native_splash:create`. White background +
# the solid lime tile carrying Stitch's uppercase-R monogram
# (renly_r_logo_tile.png, padded to ~66% of its own 1024px canvas the
# same way renly_logo_tile.png -- the wordmark version this replaces --
# was, so Android 12+'s circular icon mask has margin to crop into
# instead of the glyph itself). Still logo-only, no branding/tagline
# image, since a thin letter-spaced strip is what caused the squashing
# on Android 12+ before; see the note in SplashScreen for that whole
# icon-slot-sizing story. Android draws splash bitmaps at their own
# source pixel width / 4 as the on-screen dp size (see
# flutter_native_splash's _saveImageAndroid, which scales every density
# bucket relative to a 4x/xxxhdpi baseline) -- this asset is 1024px, same
# as the wordmark tile it replaces, so on-screen size is unchanged.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/illustrations/renly_r_logo_tile.png
  android_12:
    color: "#FFFFFF"
    image: assets/illustrations/renly_r_logo_tile.png

# Consumed by `dart run flutter_launcher_icons`. Back to a real Adaptive
# Icon setup (superseding the single-flat-image config directly above this
# comment in git history) so the lime `adaptive_icon_background` actually
# shows through, per a direct ask -- the prior round's `app_icon.png` was
# a fully OPAQUE 1024x1024 square (ink color edge-to-edge, no transparent
# margin at all), which would have completely hidden any
# `adaptive_icon_background` color if reused as-is for
# `adaptive_icon_foreground`: an opaque foreground occludes 100% of the
# background layer beneath it regardless of what color that background is.
# Rebuilt `app_icon.png` as a real transparent PNG instead: a black
# rounded-square badge (same `AppColors.ink`, same corner-radius ratio as
# `RStarBadge`'s own `Container`) at 66% of the canvas -- this project's
# established adaptive-icon safe-zone ratio -- with fully transparent
# margin around it, so Android's mask reveals the lime background color in
# the corners/edges instead of clipping through solid ink. The R+star glyph
# inside the badge is contain-fit into the same proportional padding
# `RStarBadge` uses (`EdgeInsets.all(size*10/64)`) plus its same optical
# `Transform.translate` nudge, so this icon and the in-app badge widget
# stay visually identical, not just similarly-themed.
#
# `image_path` points at the SAME file, used only for the legacy
# pre-Android-8 fallback + iOS (neither supports the adaptive split) --
# `remove_alpha_ios: true` flattens the transparent margin for iOS, which
# requires fully opaque icons; without an explicit iOS background color in
# this config, that flattening defaults to whatever `flutter_launcher_icons`
# itself composites onto (typically white), so iOS's icon will show a
# white margin around the badge rather than lime -- a real, accepted
# platform gap, not a bug, since iOS's OWN system-wide rounded-square mask
# already means it never matched Android's shape story anyway (see this
# project's earlier icon-work comments elsewhere in this file).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#CCFF00"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
