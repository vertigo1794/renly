name: renly
description: "renly — verified co-broking platform for Malaysian real estate negotiators."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.0
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  flutter_stripe: ^14.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  phosphor_flutter: ^2.1.0
  # Regular dependency, not dev-only: FlutterNativeSplash.preserve()/remove()
  # are called from main.dart/splash_screen.dart at runtime, not just from
  # the `dart run flutter_native_splash:create` generator.
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/illustrations/
    - .env

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Consumed by `dart run flutter_native_splash:create`. White background +
# the solid lime app-icon tile (renly_logo_tile.png, a square roughly-1:1
# asset -- still logo-only, no branding/tagline image, since a thin
# letter-spaced strip is what caused the squashing on Android 12+ before;
# see the note in SplashScreen for that whole icon-slot-sizing story).
# Android draws splash bitmaps at their own source pixel width / 4 as the
# on-screen dp size (see flutter_native_splash's _saveImageAndroid, which
# scales every density bucket relative to a 4x/xxxhdpi baseline) -- this
# asset is 1024px vs the 512px wordmark used before, so the on-screen logo
# comes out roughly double the size with no extra crop/scale step needed.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/illustrations/renly_logo_tile.png
  android_12:
    color: "#FFFFFF"
    image: assets/illustrations/renly_logo_tile.png

# Consumed by `dart run flutter_launcher_icons`. Unlike the native splash's
# SplashScreen API (which forces whatever single image it's given through
# its own icon-slot mask with no real way to control the composition), this
# is Android's actual Adaptive Icon system -- built specifically to take a
# transparent foreground (renly_icon_foreground.png, the wordmark text
# alone) over a solid background color and composite/mask them correctly
# for whatever shape a given launcher uses (circle on this project's
# emulator, squircle/rounded-square elsewhere -- all handled correctly by
# the OS, not fought against). The foreground is positioned at 78% scale
# (paired with adaptive_icon_foreground_inset below to land the FINAL
# visible size around 65-70% of the circle) using OPTICAL centering on
# BOTH axes, not a bounding-box center: vertically, "renly"'s 'y'
# descender extends much further below the baseline than the 'l' ascender
# extends above it, so centering by the full glyph bbox put the
# visually-dense x-height band noticeably above true center once masked
# -- fixed by centering on the midpoint between the ascender-top and
# baseline instead. Horizontally, the same class of bug showed up as a
# rightward shift: the word's ink-mass centroid sat ~30px right of its
# own bbox's geometric center (more visual weight in "nly" than "re"), so
# equal LEFT/RIGHT bbox margins is not the same thing as visually
# centered -- fixed by centering on the column-wise ink-mass centroid
# instead of the bbox midpoint (verified post-render: final centroid sits
# 0.16px off true canvas center, essentially pixel-perfect).
# `image_path` is the flat
# pre-composited fallback (renly_icon_flat.png) for iOS and pre-8 Android,
# neither of which support the adaptive foreground/background split -- iOS
# always applies its own system-wide rounded-square mask to a plain square
# image, never a true circle; that's an Apple platform convention, not a
# limitation of this config.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/illustrations/renly_icon_flat.png
  min_sdk_android: 21
  adaptive_icon_background: "#D4FF00"
  adaptive_icon_foreground: assets/illustrations/renly_icon_foreground.png
  # The generator's own default inset (16%) shrinks the foreground by an
  # ADDITIONAL 32% on top of whatever our own asset already leaves as
  # margin -- halving it here is most of how "renly" grows from ~37% to
  # ~65% of the visible circle, the other half being the foreground
  # asset's own scale (78% of its 1024px canvas, up from 55%).
  adaptive_icon_foreground_inset: 8
