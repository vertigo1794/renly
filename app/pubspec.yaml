name: renly
description: "renly — verified co-broking platform for Malaysian real estate negotiators."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.0
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  flutter_stripe: ^14.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  phosphor_flutter: ^2.1.0
  # Regular dependency, not dev-only: FlutterNativeSplash.preserve()/remove()
  # are called from main.dart/splash_screen.dart at runtime, not just from
  # the `dart run flutter_native_splash:create` generator.
  flutter_native_splash: ^2.4.7
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0
  # Promoted from dev_dependencies: login_screen.dart persists the
  # `has_dismissed_biometric_prompt` flag at runtime, so this is now a real
  # runtime dependency, not test-only tooling.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/illustrations/
    - assets/images/
    - .env

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Consumed by `dart run flutter_native_splash:create`. Lime (#CCFF00)
# background + splash_logo_box.png (assets/images/, a new directory
# introduced for this asset) -- a transparent PNG carrying JUST the R*
# badge (black rounded-square, white R + star, no "renly" text), scaled to
# 50% of its own 1024px canvas this round (was 66% -- ~24% smaller, per a
# direct ask), replacing splash_logo.png. TRANSPARENT background
# deliberately, not a baked-in solid square, so this config's own
# `color`/`android_12.color` is the only thing painting the background --
# the same lesson the launcher icon hit (`60c0728`): an opaque source
# image occludes whatever background color this config sets, regardless
# of its value.
#
# **The rounded-square SHAPE only ever renders as-is in this pubspec/app
# config; whether it displays as a square, squircle, or circle on an
# actual device is decided by Android 12+'s SplashScreen API applying
# THAT DEVICE'S OWN adaptive-icon mask shape to whatever image this key
# points at -- a system/launcher setting, not something any
# flutter_native_splash key controls.** This project's own emulator
# happens to use a circular mask (confirmed repeatedly, including by
# testing an edge-to-edge tile that got clipped straight through the
# glyph -- see the note in SplashScreen), which is why every screenshot
# taken here shows a circle regardless of the source asset's own corners.
# The only real way to force a specific shape regardless of device is
# native Android code (androidx.core.splashscreen + a custom
# MainActivity) -- offered and explicitly declined earlier this project
# via AskUserQuestion in favor of accepting the OS-applied shape, a
# decision this round's asset-size change doesn't reopen on its own.
# Android draws splash bitmaps at their own source pixel width / 4 as the
# on-screen dp size (flutter_native_splash's _saveImageAndroid, scaling
# every density bucket relative to a 4x/xxxhdpi baseline) -- this asset
# is 1024px, same as the file it replaces, so the on-screen SIZE change
# comes entirely from the smaller 50% content ratio, not a different
# canvas dimension.
flutter_native_splash:
  color: "#CCFF00"
  image: assets/images/splash_logo_box.png
  android_12:
    image: assets/images/splash_logo_box.png
    color: "#CCFF00"

# Consumed by `dart run flutter_launcher_icons`. Back to a real Adaptive
# Icon setup (superseding the single-flat-image config directly above this
# comment in git history) so the lime `adaptive_icon_background` actually
# shows through, per a direct ask -- the prior round's `app_icon.png` was
# a fully OPAQUE 1024x1024 square (ink color edge-to-edge, no transparent
# margin at all), which would have completely hidden any
# `adaptive_icon_background` color if reused as-is for
# `adaptive_icon_foreground`: an opaque foreground occludes 100% of the
# background layer beneath it regardless of what color that background is.
# Rebuilt `app_icon.png` as a real transparent PNG instead: a black
# rounded-square badge (same `AppColors.ink`, same corner-radius ratio as
# `RStarBadge`'s own `Container`) at 66% of the canvas -- this project's
# established adaptive-icon safe-zone ratio -- with fully transparent
# margin around it, so Android's mask reveals the lime background color in
# the corners/edges instead of clipping through solid ink. The R+star glyph
# inside the badge is contain-fit into the same proportional padding
# `RStarBadge` uses (`EdgeInsets.all(size*10/64)`) plus its same optical
# `Transform.translate` nudge, so this icon and the in-app badge widget
# stay visually identical, not just similarly-themed.
#
# `image_path` points at the SAME file, used only for the legacy
# pre-Android-8 fallback + iOS (neither supports the adaptive split) --
# `remove_alpha_ios: true` flattens the transparent margin for iOS, which
# requires fully opaque icons; without an explicit iOS background color in
# this config, that flattening defaults to whatever `flutter_launcher_icons`
# itself composites onto (typically white), so iOS's icon will show a
# white margin around the badge rather than lime -- a real, accepted
# platform gap, not a bug, since iOS's OWN system-wide rounded-square mask
# already means it never matched Android's shape story anyway (see this
# project's earlier icon-work comments elsewhere in this file).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#CCFF00"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
